<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Votação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="logo-area">
            <img src="logo.png" alt="Logotipo" onerror="this.style.display='none'">
            <h1>Situação Eleitoral</h1>
        </div>
        
        <div class="form">
            <input type="number" id="idade" placeholder="Digite a idade da pessoa">
            
            <button onclick="verificarVoto()">Verificar Situação</button>
        </div>

        <div class="resultado" id="box-resultado">
            <div class="linha" id="texto-resultado" style="color: white; text-align: center; font-size: 18px;">
                </div>
        </div>
    </div>

    <script src="voto.js"></script>
</body>
</html>
