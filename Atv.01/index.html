<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="logo-area">
            <h1>Calculadora</h1>
        </div>
        
        <div class="form">
            <input type="number" id="valor1" placeholder="Digite o 1º número">
            <input type="number" id="valor2" placeholder="Digite o 2º número">
            
            <select id="operacao" style="width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;">
                <option value="somar">Somar (+)</option>
                <option value="subtrair">Subtrair (-)</option>
                <option value="multiplicar">Multiplicar (*)</option>
                <option value="dividir">Dividir (/)</option>
            </select>
            
            <button onclick="realizarCalculo()">Calcular</button>
        </div>

        <div class="resultado" id="box-resultado">
            <div class="linha" id="texto-resultado" style="color: white; text-align: center;">
                </div>
        </div>
    </div>

    <script src="calculadora.js"></script>
</body>
</html>
